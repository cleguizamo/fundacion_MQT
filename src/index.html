<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Fundación Manos que Transforman</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Fundación Manos que Transforman: entidad sin ánimo de lucro dedicada al desarrollo social y educativo para comunidades vulnerables."
  >
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <form name="contacto-mqt" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contacto-mqt">
    <input name="bot-field">
    <input name="nombre" type="text">
    <input name="correo" type="email">
    <input name="telefono" type="tel">
    <select name="tipo-apoyo">
      <option>Voluntario</option>
      <option>Donante</option>
      <option>Aliado institucional</option>
      <option>Comunidad beneficiaria</option>
    </select>
    <textarea name="mensaje"></textarea>
  </form>
  <app-root></app-root>
</body>
</html>
